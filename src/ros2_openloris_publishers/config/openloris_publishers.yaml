openloris_depth_pointcloud:
  ros__parameters:
    image_topic: /d400/depth/image_raw
    camera_info_topic: /d400/depth/camera_info
    pointcloud_topic: /openloris/point_cloud
    depth_scale: 0.001
    min_depth: 0.0
    max_depth: 8.0
    pixel_stride: 1
    edge_discontinuity_rel: 0.01
    use_sim_time: true

openloris_stereo_pointcloud:
  ros__parameters:
    left_image_topic: /t265/fisheye1/image_raw
    right_image_topic: /t265/fisheye2/image_raw
    left_camera_info_topic: /t265/fisheye1/camera_info
    right_camera_info_topic: /t265/fisheye2/camera_info
    pointcloud_topic: /openloris/stereo/point_cloud
    min_depth: 0.3
    max_depth: 5.0
    point_stride: 1
    rectified_focal_length: 285.0
    min_disparity: 0
    num_disparities: 128
    block_size: 7
    uniqueness_ratio: 10
    speckle_window_size: 100
    speckle_range: 2
    disparity_edge_threshold: 4.0
    sync_tolerance_ms: 2.0
    opencv_threads: 4
    # Calibrated t265_fisheye2 pose expressed in t265_fisheye1.
    camera2_translation_camera1:
      [0.0639765113592148, 0.000148267135955393, -0.000398468371713534]
    camera2_rotation_camera1_xyzw:
      [0.00188497, 0.00347595, 0.00154952, 0.999991]
    use_sim_time: true

openloris_imu_merger:
  ros__parameters:
    accel_topic: /d400/accel/sample
    gyro_topic: /d400/gyro/sample
    imu_topic: /openloris/imu
    max_accel_age: 0.05
    accel_variance: 0.01
    gyro_variance: 0.0001
    use_sim_time: true

openloris_odometry_tf:
  ros__parameters:
    odometry_topic_in: /odom
    odometry_topic_out: /openloris/odom
    parent_frame: base_odom
    child_frame: base_link
    normalize_to_first_pose: true
    linear_velocity_variance: 0.005
    angular_velocity_variance: 0.01
    position_variance: 0.01
    orientation_variance: 0.01
    use_sim_time: true

openloris_ground_truth:
  ros__parameters:
    tf_topic_in: /gt
    source_child_frame: base_link
    frame_id: map
    child_frame_id: base_link_gt
    pose_topic_out: /openloris/ground_truth/pose
    path_topic_out: /openloris/ground_truth/path
    normalize_to_first_pose: true
    publish_tf: true
    path_min_distance: 0.02
    use_sim_time: true
